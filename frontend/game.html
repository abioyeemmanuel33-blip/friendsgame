<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Game — Friends Game</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="game-page">
  <main class="game-wrap">
    <header class="game-header">
      <span>Room: <strong id="roomCode">—</strong></span>
      <span class="muted" id="hintText">Arrows / WASD to move</span>
    </header>

    <div id="toast" class="toast" hidden></div>

    <canvas id="gameCanvas" width="800" height="800"></canvas>

    <div id="touchControls" class="touch-controls">
      <button class="dpad dpad-up"    data-dir="up">▲</button>
      <button class="dpad dpad-left"  data-dir="left">◀</button>
      <button class="dpad dpad-right" data-dir="right">▶</button>
      <button class="dpad dpad-down"  data-dir="down">▼</button>
      <div id="joystickBase" class="joystick-base">
        <div id="joystickKnob" class="joystick-knob"></div>
      </div>
    </div>

    <section class="game-footer">
      <button id="backBtn" class="secondary">Back to Lobby</button>
    </section>

    <div id="resultsOverlay" class="overlay" hidden>
      <div class="overlay-card">
        <h1>Race Finished</h1>
        <ul id="rankingList" class="ranking-list"></ul>
        <button id="overlayBackBtn" class="primary">Back to Lobby</button>
      </div>
    </div>

    <div id="deathOverlay" class="overlay" hidden>
      <div class="overlay-card death-card">
        <h1>💀</h1>
        <p class="death-text">Respawning in</p>
        <p class="death-count" id="deathCount">5</p>
      </div>
    </div>
  </main>

  <script src="/js/game.js"></script>
</body>
</html>
